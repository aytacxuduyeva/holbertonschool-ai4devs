openapi: 3.0.3
info:
  title: Inventory API
  description: Anbar idarəetməsi üçün CRUD əməliyyatlarını dəstəkləyən API.
  version: 1.0.0
servers:
  - url: https://api.inventory-app.com/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Laptop"
        price:
          type: number
          example: 1200.50
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
security:
  - bearerAuth: []
paths:
  /products:
    get:
      summary: Bütün məhsulları siyahıla (Pagination ilə)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Uğurlu cavab
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Yeni məhsul əlavə et
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Məhsul yaradıldı
        '400':
          description: Yanlış məlumat
  /products/{id}:
    get:
      summary: İD-yə görə məhsulu gətir
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Məhsul tapıldı
        '404':
          description: Məhsul tapılmadı
    put:
      summary: Məhsulu yenilə
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Məhsul yeniləndi
    delete:
      summary: Məhsulu sil
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Məhsul silindi
